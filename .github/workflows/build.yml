name: Build and Release Chrome Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Build and validate installation package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG"

      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes="releases/$RELEASE_TAG.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Dalex Chrome Cleaner $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "Dalex Chrome Cleaner $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          mkdir -p "$RUNNER_TEMP/release-verification"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-verification" \
            --pattern '*.zip' --pattern 'SHA256SUMS.txt' --clobber
          (cd "$RUNNER_TEMP/release-verification" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest
