<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalex: Chrome Cleaner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="options">
<main>
<header>
<img src="icons/icon48.png" alt="">
<div>
<h1>Dalex Cleaner</h1>
<p>A little less history. A little more privacy.</p>
</div>
</header>
<h2>Cleaning preferences</h2>
<p>Choose what to clear and your default time range.</p>
<form id="settingsForm">
<fieldset id="fields" disabled>
<legend>Data to clean</legend>
<label class="option">
<input type="checkbox" id="clearHistory">
<span>
<strong>Browsing history</strong>
<small>Remove your record of visited pages.</small>
</span>
</label>
<label class="option">
<input type="checkbox" id="clearCookies">
<span>
<strong>Cookies</strong>
<small>Remove website cookies. You may be signed out.</small>
</span>
</label>
<label class="option">
<input type="checkbox" id="clearCache">
<span>
<strong>Cached images and files</strong>
<small>Sites may load more slowly on your next visit.</small>
</span>
</label>
<label for="timeRange" class="label range-label">Time range</label>
<select id="timeRange">
<option value="hour">Last hour</option>
<option value="day">Last 24 hours</option>
<option value="week">Last 7 days</option>
<option value="month">Last 30 days</option>
<option value="all">All time</option>
</select>
</fieldset>
<p class="warning">Cleanup cannot be undone. Passwords, bookmarks and downloaded files are not selected for removal.</p>
<button id="save" class="primary" type="submit" disabled>Save settings</button>
<p id="status" class="status" role="status" aria-live="polite">
</p>
</form>
</main>
<script src="settings.js">
</script>
<script src="options.js">
</script>
</body>
</html>
