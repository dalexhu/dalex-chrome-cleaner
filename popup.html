<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalex: Chrome Cleaner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
<main>
<header>
<img src="icons/icon48.png" alt="">
<div>
<h1>Dalex Cleaner</h1>
<p>A little less history. A little more privacy.</p>
</div>
</header>
<span class="label">WHAT TO CLEAN</span>
<div id="summary" class="summary">Loading preferences…</div>
<label for="timeRange" class="label range-label">Time range</label>
<select id="timeRange">
<option value="hour">Last hour</option>
<option value="day">Last 24 hours</option>
<option value="week">Last 7 days</option>
<option value="month">Last 30 days</option>
<option value="all">All time</option>
</select>
<p id="cookieWarning" class="warning" hidden>Clearing cookies may sign you out of websites.</p>
<p class="warning">Cleanup cannot be undone.</p>
<button id="cleanButton" class="primary" disabled>Clean now</button>
<p id="status" class="status" role="status" aria-live="polite">
</p>
<footer>
<span>No tracking · No analytics</span>
<button id="settings" class="link">Settings ↗</button>
</footer>
</main>
<script src="settings.js">
</script>
<script src="popup.js">
</script>
</body>
</html>
